name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test --workspace @vaultdeck/llm
      - run: npm run contract:lint
      - run: npm run contract:check
      - run: npm run check:sanitize
      - run: npm run build --workspace @vaultdeck/api
      - run: npm run build --workspace @vaultdeck/web
