            application/json:
              schema: { $ref: '#/components/schemas/ShareView' }
        '404': { $ref: '#/components/responses/NotFound' }
  /share/{token}:
    get:
      tags: [shares]
      operationId: downloadSharedFile
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, minLength: 20, maxLength: 120 } }
      responses:
        '200':
          description: 文件内容（限局域网来源访问）
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
  /agent/grants:
    post:
      tags: [agent]
      operationId: createAgentGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentGrantCreate' }
      responses:
        '200':
          description: 已创建，授权码明文只在此响应出现一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentGrantCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [agent]
      operationId: listAgentGrants
      responses:
        '200':
          description: 授权清单
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgentGrantView' }
  /agent/grants/{grantId}:
    patch:
      tags: [agent]
      operationId: revokeAgentGrant
      parameters:
        - { name: grantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentGrantRevoke' }
      responses:
        '200':
          description: 已撤销，该授权的 token 立即失效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentGrantView' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agent/token:
    post:
      tags: [agent]
      operationId: exchangeAgentToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTokenRequest' }
      responses:
        '200':
          description: 兑换成功，token 明文只在此响应出现一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /system/settings:
    get:
      tags: [system]
      operationId: getSettings
      responses:
        '200':
          description: 系统设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
    patch:
      tags: [system]
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatch' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vd_session
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FolderId:
      name: folderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BundleId:
      name: bundleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RangeHeader:
      name: Range
      in: header
      required: false
      description: 形如 bytes=0-1048575
      schema: { type: string }
  responses:
    BadRequest:
      description: 请求错误
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: 未认证
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 不存在或不可见
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 冲突
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: 已过期
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RangeNotSatisfiable:
      description: Range 不可满足
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: 触发限流
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      additionalProperties: false
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, pattern: '^VD-[A-Z]{3}-[0-9]{3}$' }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    RoleCode:
      type: string
      enum: [LEADER, DEPUTY_LEADER, MEMBER]
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 256 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 256 }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 64 }
    AvatarResult:
      type: object
      required: [avatarUrl]
      properties:
        avatarUrl: { type: string }
    Principal:
      type: object
      required: [userId, username, displayName, role]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/RoleCode' }
        avatarUrl: { type: string }
        projectIds:
          type: array
          items: { type: string, format: uuid }
    LoginResult:
      allOf:
        - $ref: '#/components/schemas/Principal'
        - type: object
          properties:
            token:
              type: string
              description: API 客户端使用的 Bearer token；x-auth-mode=cookie 时不返回
    MfaChallenge:
      type: object
      required: [mfaRequired, challengeToken, expiresInSeconds]
      properties:
        mfaRequired: { type: boolean, enum: [true] }
        challengeToken: { type: string }
        expiresInSeconds: { type: integer, minimum: 1 }
    MfaStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    MfaSetup:
      type: object
      required: [secret, otpauthUrl]
      properties:
        secret: { type: string }
        otpauthUrl: { type: string }
    MfaVerifyRequest:
      type: object
      required: [challengeToken, code]
      additionalProperties: false
      properties:
        challengeToken: { type: string, maxLength: 4096 }
        code: { type: string, pattern: '^\\d{6}$' }
    MfaCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^\\d{6}$' }
    MfaDisableRequest:
      type: object
      required: [password, code]
      additionalProperties: false
      properties:
        password: { type: string, maxLength: 256 }
        code: { type: string, pattern: '^\\d{6}$' }
    User:
      type: object
      required: [userId, username, displayName, role, status]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/RoleCode' }
        status: { type: string, enum: [active, disabled] }
        lastLoginAt: { type: string, format: date-time }
    UserPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        total: { type: integer, minimum: 0 }
    CreateUserRequest:
      type: object
      required: [username, displayName, role, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        displayName: { type: string, minLength: 1, maxLength: 64 }
        role: { $ref: '#/components/schemas/RoleCode' }
        password: { type: string, minLength: 8, maxLength: 256 }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 64 }
        role: { $ref: '#/components/schemas/RoleCode' }
        status: { type: string, enum: [active, disabled] }
        password: { type: string, minLength: 8, maxLength: 256 }
    Project:
      type: object
      required: [projectId, projectCode, projectName, status]
      properties:
        projectId: { type: string, format: uuid }
        projectCode: { type: string }
        projectName: { type: string }
        status: { type: string, enum: [active, archived] }
        createdAt: { type: string, format: date-time }
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
    CreateProjectRequest:
      type: object
      required: [projectCode, projectName]
      additionalProperties: false
      properties:
        projectCode: { type: string, minLength: 1, maxLength: 32 }
        projectName: { type: string, minLength: 1, maxLength: 128 }
    ProjectMember:
      type: object
      required: [projectId, userId, memberRole]
      properties:
        projectId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        memberRole: { type: string, enum: [DEPUTY_LEADER, MEMBER] }
        joinedAt: { type: string, format: date-time }
    AddProjectMemberRequest:
      type: object
      required: [userId, memberRole]
      additionalProperties: false
      properties:
        userId: { type: string, format: uuid }
        memberRole: { type: string, enum: [DEPUTY_LEADER, MEMBER] }
    Category:
      type: object
      required: [categoryId, categoryCode, categoryName, isSystem]
      properties:
        categoryId: { type: string, format: uuid }
        categoryCode: { type: string }
        categoryName: { type: string }
        extensions:
          type: array
          items: { type: string }
        isSystem: { type: boolean }
    CreateCategoryRequest:
      type: object
      required: [categoryCode, categoryName, extensions]
      additionalProperties: false
      properties:
        categoryCode: { type: string, minLength: 1, maxLength: 32 }
        categoryName: { type: string, minLength: 1, maxLength: 64 }
        extensions:
          type: array
          minItems: 1
          items: { type: string, pattern: '^\.[a-z0-9]+$' }
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        categoryName: { type: string, minLength: 1, maxLength: 64 }
        extensions:
          type: array
          minItems: 1
          items: { type: string, pattern: '^\.[a-z0-9]+$' }
    Folder:
      type: object
      required: [folderId, projectId, folderName]
      properties:
        folderId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        parentId:
          type: [string, 'null']
          format: uuid
        folderName: { type: string }
        depth: { type: integer, minimum: 0 }
    FolderSearchHit:
      type: object
      required: [folderId, folderName, projectId, projectName, path]
      properties:
        folderId: { type: string, format: uuid }
        folderName: { type: string }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        path: { type: string }
    CreateFolderRequest:
      type: object
      required: [projectId, folderName]
      additionalProperties: false
      properties:
        projectId: { type: string, format: uuid }
        parentId:
          type: [string, 'null']
          format: uuid
        folderName: { type: string, minLength: 1, maxLength: 200 }
    UpdateFolderRequest:
      type: object
      required: [folderName]
      additionalProperties: false
      properties:
        folderName: { type: string, minLength: 1, maxLength: 200 }
    File:
      type: object
      required: [fileId, fileName, sizeBytes, projectId, folderId, categoryId, sha256]
      properties:
        fileId: { type: string, format: uuid }
        fileName: { type: string }
        extension: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        projectId: { type: string, format: uuid }
        folderId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        uploaderId: { type: string, format: uuid }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        status: { type: string, enum: [active, trashed, purging, corrupted] }
        hasContent: { type: boolean }
        createdAt: { type: string, format: date-time }
    FilePage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/File' }
        total: { type: integer, minimum: 0 }
    UpdateFileRequest:
      type: object
      additionalProperties: false
      properties:
        fileName: { type: string, minLength: 1, maxLength: 200 }
        folderId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
    PrecheckRequest:
      type: object
      required: [projectId, folderId, fileName, sizeBytes, clientFingerprint]
      additionalProperties: false
      properties:
        projectId: { type: string, format: uuid }
        folderId: { type: string, format: uuid }
        fileName: { type: string, minLength: 1, maxLength: 200 }
        sizeBytes: { type: integer, minimum: 1, maximum: 21474836480 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        clientFingerprint: { type: string, maxLength: 128 }
    PrecheckResult:
      oneOf:
        - type: object
          required: [kind, fileId, objectId]
          properties:
            kind: { const: instant }
            fileId: { type: string, format: uuid }
            objectId: { type: string }
        - type: object
          required: [kind, sessionId, receivedChunks]
          properties:
            kind: { const: resume }
            sessionId: { type: string, format: uuid }
            receivedChunks:
              type: array
              items: { type: integer, minimum: 0 }
        - type: object
          required: [kind, sessionId, chunkSize, chunkCount, expiresAt]
          properties:
            kind: { const: new }
            sessionId: { type: string, format: uuid }
            chunkSize: { type: integer }
            chunkCount: { type: integer }
            expiresAt: { type: string, format: date-time }
    UploadSession:
      type: object
      required: [sessionId, status, receivedChunks, receivedBytes]
      properties:
        sessionId: { type: string, format: uuid }
        status: { type: string, enum: [init, uploading, merging, completed, expired, failed] }
        receivedChunks:
          type: array
          items: { type: integer, minimum: 0 }
        receivedBytes: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time }
        file: { $ref: '#/components/schemas/File' }
        error: { type: string }
    ChunkReceipt:
      type: object
      required: [chunkIndex, receivedBytes]
      properties:
        chunkIndex: { type: integer, minimum: 0 }
        receivedBytes: { type: integer, minimum: 0 }
    CompleteUploadRequest:
      type: object
      required: [sha256]
      additionalProperties: false
      properties:
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    JobAccepted:
      type: object
      required: [status, statusUrl]
      properties:
        status: { type: string }
        statusUrl: { type: string }
        queuePosition: { type: integer, minimum: 0 }
        etaSeconds: { type: integer, minimum: 0 }
    CreateBundleRequest:
      type: object
      required: [fileIds]
      additionalProperties: false
      properties:
        fileIds:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
        folderIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
    Bundle:
      type: object
      required: [bundleId, status, totalBytes, chunkedRanges]
      properties:
        bundleId: { type: string, format: uuid }
        status: { type: string, enum: [queued, building, ready, failed, expired] }
        totalBytes: { type: integer, minimum: 0 }
        chunkedRanges: { type: boolean }
    TrashEntry:
      type: object
      required: [trashId, resourceType, resourceId, deletedAt, expireAt]
      properties:
        trashId: { type: string, format: uuid }
        resourceType: { type: string, enum: [file, folder] }
        resourceId: { type: string, format: uuid }
        originalFolderId: { type: string, format: uuid }
        deletedAt: { type: string, format: date-time }
        expireAt: { type: string, format: date-time }
    SearchResult:
      type: object
      required: [items, total, asOf]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/File' }
        total: { type: integer, minimum: 0 }
        asOf: { type: string, format: date-time }
        truncated: { type: boolean }
    ProjectStats:
      type: object
      required: [projectId, generatedAt, categories]
      properties:
        projectId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        categories:
          type: array
          items:
            type: object
            required: [categoryId, count, totalBytes]
            properties:
              categoryId: { type: string, format: uuid }
              count: { type: integer, minimum: 0 }
              totalBytes: { type: integer, minimum: 0 }
        trashCount: { type: integer, minimum: 0 }
        trashBytes: { type: integer, minimum: 0 }
    CreateStatsExportRequest:
      type: object
      required: [dims]
      additionalProperties: false
      properties:
        dims:
          type: array
          minItems: 1
          items: { type: string, enum: [project, category, uploader] }
        projectId: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    StatsExport:
      type: object
      required: [exportId, status]
      properties:
        exportId: { type: string, format: uuid }
        status: { type: string, enum: [queued, building, ready, failed] }
        statusUrl: { type: string }
    AuditEntry:
      type: object
      required: [auditId, action, result, occurredAt, requestId]
      properties:
        auditId: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        actorRole: { $ref: '#/components/schemas/RoleCode' }
        action: { type: string }
        objectType: { type: string }
        objectId: { type: string }
        result: { type: string, enum: [success, denied, failed] }
        reason: { type: string }
        sourceIp: { type: string }
        occurredAt: { type: string, format: date-time }
        requestId: { type: string }
    AuditPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        total: { type: integer, minimum: 0 }
    CreateImportJobRequest:
      type: object
      required: [projectId, sourceMode]
      additionalProperties: false
      properties:
        projectId: { type: string, format: uuid }
        sourceMode: { type: string, enum: [web, cli] }
        rootName: { type: string, maxLength: 200 }
    ImportJob:
      type: object
      required: [jobId, status, succeeded, skipped, failed]
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, completed, failed] }
        succeeded: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        statusUrl: { type: string }
    Health:
      type: object
      required: [status, uptimeSeconds]
      properties:
        status: { type: string, enum: [ok, degraded] }
        uptimeSeconds: { type: integer, minimum: 0 }
        activeSessions: { type: integer, minimum: 0 }
        storageVolumeFreeBytes: { type: integer, nullable: true }
        storage:
          type: object
          nullable: true
          properties:
            totalBytes: { type: integer }
            freeBytes: { type: integer }
            usedPercent: { type: number }
            writeBlocked: { type: boolean }
        errors24h: { type: integer, minimum: 0 }
        alerts:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              level: { type: string, enum: [warning, critical] }
              message: { type: string }
        preview:
          type: object
          properties:
            officeServer: { type: boolean }
    Settings:
      type: object
      properties:
        maxUploadBytes: { type: integer, minimum: 1 }
        chunkSizeBytes: { type: integer, minimum: 1048576 }
        trashRetentionDays: { type: integer, minimum: 10 }
        instantUploadEnabled: { type: boolean }
    SettingsPatch:
      type: object
      additionalProperties: false
      properties:
        maxUploadBytes: { type: integer, minimum: 1 }
        chunkSizeBytes: { type: integer, minimum: 1048576 }
        trashRetentionDays: { type: integer, minimum: 1, maximum: 365 }
        instantUploadEnabled: { type: boolean }
    AiSettingsView:
      type: object
      additionalProperties: false
      properties:
        providerId: { type: [string, 'null'] }
        baseUrl: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        effort: { type: [string, 'null'] }
        embeddingModel: { type: [string, 'null'] }
        hasApiKey: { type: boolean }
    AiProviderEntry:
      type: object
      required: [id, displayName, baseUrl, modelsSupported, family, effortSupported, customEndpoint, note]
      properties:
        id: { type: string }
        displayName: { type: string }
        baseUrl: { type: string }
        modelsSupported: { type: array, items: { type: string } }
        family: { type: string }
        effortLevels: { type: [array, 'null'], items: { type: string } }
        effortSupported: { type: boolean }
        customEndpoint: { type: boolean }
        note: { type: string }
        fallbackModels: { type: array, items: { type: string } }
    AiSettingsBundle:
      type: object
      required: [settings, providers, encryptionEnabled]
      properties:
        settings: { $ref: '#/components/schemas/AiSettingsView' }
        providers:
          type: array
          items: { $ref: '#/components/schemas/AiProviderEntry' }
        encryptionEnabled: { type: boolean }
    AiSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        providerId: { type: [string, 'null'] }
        baseUrl: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        effort: { type: [string, 'null'] }
        embeddingModel: { type: [string, 'null'] }
        apiKey: { type: string, maxLength: 300, writeOnly: true }
        clearApiKey: { type: boolean }
    AiModelsResult:
      type: object
      required: [models, source]
      properties:
        models: { type: array, items: { type: string } }
        source: { type: string, enum: [api, stale, fallback] }
        warning: { type: [string, 'null'] }
    ParsedSearchFilters:
      type: object
      additionalProperties: false
      properties:
        keyword: { type: [string, 'null'] }
        uploadedFrom: { type: [string, 'null'] }
        uploadedTo: { type: [string, 'null'] }
        minSizeBytes: { type: [integer, 'null'], minimum: 0 }
        maxSizeBytes: { type: [integer, 'null'], minimum: 0 }
        extensions: { type: [array, 'null'], items: { type: string } }
    ParseSearchResult:
      type: object
      required: [filters]
      properties:
        filters:
          anyOf:
            - { $ref: '#/components/schemas/ParsedSearchFilters' }
