openapi: 3.1.0
info:
  title: VaultDeck API
  version: 1.0.0
  description: 本地部署资料管理系统的对外契约。错误统一使用 RFC 9457 Problem Details，越权一律返回 404。
  license:
    name: Proprietary
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: auth
  - name: users
  - name: projects
  - name: categories
  - name: folders
  - name: files
  - name: upload-sessions
  - name: bundles
  - name: trash
  - name: search
  - name: stats
  - name: audit
  - name: imports
  - name: system
  - name: ai
  - name: agent
  - name: shares
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      parameters:
        - name: x-auth-mode
          in: header
          required: false
          schema: { type: string, enum: [cookie] }
          description: 传 cookie 时不返回 token，仅通过 HttpOnly Cookie 维持会话
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly + SameSite=Strict 的 vd_session Cookie
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResult'
                  - $ref: '#/components/schemas/MfaChallenge'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': { description: 已登出 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: 已修改，其他会话失效 }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/mfa:
    get:
      tags: [auth]
      operationId: getMfaStatus
      responses:
        '200':
          description: 当前账号的 MFA 状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/mfa/verify:
    post:
      tags: [auth]
      operationId: verifyMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200':
          description: MFA 验证通过并建立会话
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly + SameSite=Strict 的 vd_session Cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/mfa/setup:
    post:
      tags: [auth]
      operationId: setupMfa
      responses:
        '200':
          description: 生成待确认的 TOTP 密钥
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaSetup' }
        '409':
          description: MFA 已启用
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/mfa/enable:
    post:
      tags: [auth]
      operationId: enableMfa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaCodeRequest' }
      responses:
        '200':
          description: 已启用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: MFA 已启用
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/mfa/disable:
    post:
      tags: [auth]
      operationId: disableMfa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaDisableRequest' }
      responses:
        '200':
          description: 已停用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [auth]
      operationId: getProfile
      responses:
        '200':
          description: 当前账号信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/avatar:
    post:
      tags: [auth]
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              x-max-bytes: 2097152
      responses:
        '201':
          description: 已更新头像
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415':
          description: 不支持的图片类型
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [auth]
      operationId: deleteAvatar
      responses:
        '204': { description: 已移除头像，恢复默认占位 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/avatar/{userId}:
    get:
      tags: [auth]
      operationId: getAvatar
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 头像图片
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
  /users:
    get:
      tags: [users]
      operationId: listUsers
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [users]
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}:
    patch:
      tags: [users]
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      responses:
        '200':
          description: 项目列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
    post:
      tags: [projects]
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /projects/{projectId}:
    get:
      tags: [projects]
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 项目详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/members:
    get:
      tags: [projects]
      operationId: listProjectMembers
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectMember' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [projects]
      operationId: addProjectMember
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddProjectMemberRequest' }
      responses:
        '201':
          description: 已加入
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMember' }
        '409': { $ref: '#/components/responses/Conflict' }
  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      responses:
        '200':
          description: 类型分类列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [categories]
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /categories/{categoryId}:
    patch:
      tags: [categories]
      operationId: updateCategory
      parameters:
        - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [categories]
      operationId: deleteCategory
      parameters:
        - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 已删除 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /folders/search:
    get:
      tags: [folders]
      operationId: searchFolders
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: 文件夹搜索结果
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FolderSearchHit' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /folders:
    get:
      tags: [folders]
      operationId: listFolders
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: parentId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 文件夹树
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Folder' }
    post:
      tags: [folders]
      operationId: createFolder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFolderRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /folders/{folderId}:
    patch:
      tags: [folders]
      operationId: updateFolder
      parameters:
        - $ref: '#/components/parameters/FolderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFolderRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [folders]
      operationId: deleteFolder
      parameters:
        - $ref: '#/components/parameters/FolderId'
      responses:
        '204': { description: 已移入回收站 }
        '404': { $ref: '#/components/responses/NotFound' }
  /files:
    get:
      tags: [files]
      operationId: listFiles
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: folderId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: 文件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilePage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /files/{fileId}:
    get:
      tags: [files]
      operationId: getFile
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: 文件信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [files]
      operationId: updateFile
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFileRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [files]
      operationId: deleteFile
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '204': { description: 已移入回收站 }
        '404': { $ref: '#/components/responses/NotFound' }
  /files/{fileId}/content:
    get:
      tags: [files]
      operationId: downloadFile
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/RangeHeader'
      responses:
        '200':
          description: 完整文件
          headers:
            ETag: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: 部分内容
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '416': { $ref: '#/components/responses/RangeNotSatisfiable' }
  /files/{fileId}/preview:
    get:
      tags: [files]
      operationId: previewFile
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: 转换后的 PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '415':
          description: 不支持预览的格式
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: 预览服务不可用或转换失败
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /upload-sessions/precheck:
    post:
      tags: [upload-sessions]
      operationId: precheckUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrecheckRequest' }
      responses:
        '200':
          description: 预检结果，三态之一
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrecheckResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /upload-sessions/{sessionId}:
    get:
      tags: [upload-sessions]
      operationId: getUploadSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 上传进度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
  /upload-sessions/{sessionId}/chunks/{index}:
    put:
      tags: [upload-sessions]
      operationId: putChunk
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: Digest, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              x-max-bytes: 8388608
      responses:
        '200':
          description: 分片已接收或幂等重复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChunkReceipt' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /upload-sessions/{sessionId}/complete:
    post:
      tags: [upload-sessions]
      operationId: completeUpload
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: Prefer
          in: header
          required: false
          schema: { type: string, example: respond-async }
          description: 传 respond-async 时立即返回 202，客户端通过 GET /upload-sessions/{sessionId} 轮询合并状态
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteUploadRequest' }
      responses:
        '200':
          description: 已合并完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '202':
          description: 合并中
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '409':
          description: 分片缺失
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /bundles:
    post:
      tags: [bundles]
      operationId: createBundle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBundleRequest' }
      responses:
        '201':
          description: 打包任务已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bundle' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /bundles/{bundleId}/content:
    get:
      tags: [bundles]
      operationId: downloadBundle
      parameters:
        - $ref: '#/components/parameters/BundleId'
        - $ref: '#/components/parameters/RangeHeader'
      responses:
        '200':
          description: ZIP 内容
          content:
            application/zip:
              schema: { type: string, format: binary }
        '206':
          description: ZIP 部分内容
          content:
            application/zip:
              schema: { type: string, format: binary }
        '202':
          description: 仍在排队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
  /trash:
    get:
      tags: [trash]
      operationId: listTrash
      responses:
        '200':
          description: 回收站条目
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrashEntry' }
  /trash/{trashId}/restore:
    post:
      tags: [trash]
      operationId: restoreTrashEntry
      parameters:
        - { name: trashId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
  /search:
    get:
      tags: [search]
      operationId: searchFiles
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, minLength: 2 } }
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - {
            name: uploadedFrom,
            in: query,
            schema: { type: string, format: date },
            description: 上传日期下限（含端点），格式 YYYY-MM-DD
          }
        - {
            name: uploadedTo,
            in: query,
            schema: { type: string, format: date },
            description: 上传日期上限（含端点），格式 YYYY-MM-DD
          }
        - {
            name: minSizeBytes,
            in: query,
            schema: { type: integer, minimum: 0 },
            description: 文件大小下限，单位字节
          }
        - {
            name: maxSizeBytes,
            in: query,
            schema: { type: integer, minimum: 0 },
            description: 文件大小上限，单位字节
          }
        - {
            name: extensions,
            in: query,
            schema: { type: string },
            description: 逗号分隔的扩展名白名单，如「pdf、docx」
          }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: uploaderId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /stats/projects:
    get:
      tags: [stats]
      operationId: getProjectStats
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 项目统计
          content:
            application/json:
